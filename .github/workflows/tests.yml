name: Portwright tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows tests
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Portwright
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  windows-arm:
    name: Windows Arm tests
    runs-on: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Portwright
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
